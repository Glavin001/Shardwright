# Support-graph layout with clustered chunks (L2 = the stress solver's graph).
#   L0 components -> L1 structural fragments -> L2 chunks -> L3 cells (debris)
# Cells are 0.3 m exact convex Voronoi cells (fracture modes and Level-1
# shapes are computed on them). L2 groups each Level-1 fragment's cells into
# compact clusters about 0.5 m across: fragments already that small stay one
# chunk, large thin ones (floor pieces) are split by footprint, and masonry
# bricks form brick clusters. The L3 cells under each chunk are its convex
# cosmetic debris. Bonds on coarser boundaries are weakened (size effect).
#
# (original header)
# Support-graph layout: the leaf level is the stress solver's chunk graph.
#   L0 components -> L1 structural fragments (fracture modes) -> L2 chunks
# With one fine cell per analysis cell, the fine cells ARE the analysis
# cells: every L2 chunk is an exact Voronoi cell clipped to the solid, so it
# is convex (one hull) wherever the solid is, and every L2-L2 bond is one
# planar facet. Finer pieces are cosmetic debris (no bonds), split from each
# chunk at bake time for the runtime to spawn when the chunk is crushed.
seed = 1337
variants = 1
levels = 4

[cells]
target_analysis_cells_per_m3 = 200
fine_per_analysis = 1
# ignore per-part / per-material overrides: chunks must be single cells
fixed_fine_per_analysis = true
# chunk size by extent (m): max(A/(2e^2), V/e^3) chunks per part, so thin,
# wide parts (floors) get chunks with footprints of about e x e; replaces the
# volume density above
max_chunk_extent = 0.3
min_cell_volume = 1.0e-7
min_thickness_ratio = 0.05

[modes]
enabled = true
k = 10
omega = 1.0e-3
material_aware = true
target_level1_fragments = 12
# Level-1 pieces at most ~1.5 m across: large parts (floors) get more than 12
max_fragment_extent = 1.5
max_iccm_iters = 50
tet_edge_ratio = 0.33

[bonds]
# Weibull weakest-link size effect: chunk bonds on L1 boundaries and L0
# joints take the strength of the whole boundary surface they lie on, so
# they are weaker per area than bonds inside an L1 fragment
size_effect = true
# Extra bias on top of the size effect, per boundary level:
# [L0 joints, L1 boundaries]; 1 = none, below 1 = break there sooner.
# Pronounced on purpose: the stress solver should clearly break along the
# predefined joints and Level-1 cuts before splitting chunks elsewhere.
boundary_factors = [0.5, 0.4]
anchor_factor = 1.0

[hierarchy]
# L2 chunks about 0.5 m across, clustered within each Level-1 fragment (0.4 = finer, 0.8 = coarser)
level2_extent = 0.5

[collision]
method = "coacd"
concavity = 0.02
max_hulls_per_fragment = 128
margin = 0.0005
min_rigid_size = 0.01

[render]
lods = 3
noise = true
chipping = true
interior_uv = "triplanar_asset_space"

[debris]
# the L3 cells are the debris; no extra split
pieces = 0
