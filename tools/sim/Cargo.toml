[package]
name = "frac-sim"
description = "Rigid-body destruction demo for baked prefracture assets (Rapier)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Built on its own (excluded from the main workspace) so the main build and
# CI do not compile Rapier.
[workspace]

[dependencies]
frac-core = { path = "../../crates/frac-core" }
frac-material = { path = "../../crates/frac-material" }
frac-fem = { path = "../../crates/frac-fem" }
frac-validate = { path = "../../crates/frac-validate" }
rapier3d = { version = "0.36", features = ["parallel"] }
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
